[project]
name = "agent-telephone"
version = "0.1.0"
description = "Does a request survive being passed through a team of agents?"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
    "filelock>=3.13",
    "rapidfuzz>=3.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_telephone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
