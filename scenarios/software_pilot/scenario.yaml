# Every hidden test calls the entry point. A natural implementation picks one channel per
# reminder, so a lost "never both" still passes its test: it cannot show H7.
endpoint: {kind: hidden_tests, path: hidden_tests, universal: [f_entry], loss_insensitive: [f_no_both]}
