id: software_pilot
domain: software
# Fact `text` values are verbatim spans of `brief` (tests enforce it), so the FakeBackend
# and the deterministic checks can locate them. Endpoint coverage: hidden_tests/.
brief: |-
  Right, this is for Brennan Opticians, the appointment reminders. I need a Python module with one entry point, `plan_reminders(appointments, now)`. It takes a list of appointment dicts and the current time and returns the reminders to send, each a dict with `appointment_id`, `channel` ("sms" or "email"), `send_at` and `text`. Each appointment has `id`, `customer_name`, `email`, `phone`, `country`, `status`, `starts_at` and the opt-out flag, and all datetimes are timezone-aware. Each text says the appointment date and the time as HH:MM.

  The opt-out flag is the field `optout_sms_v2`, not the old `opt_out` one, because the old field went stale after the March CRM migration.

  Send the first reminder 48 hours before the appointment and the second one two hours before. If the 48-hour point has already passed when we run, send the first one immediately, at `now`, instead. Never return a reminder with a `send_at` in the past.

  Text them if they have a phone number. If optout_sms_v2 is true, don't — email them instead. Never send both an SMS and an email for the same reminder.

  An SMS must be at most 160 characters. If it's too long, shorten the customer's name, but always keep the appointment date and time — the time matters more than the name.

  Nothing goes out between 21:00 and 08:00; move anything in that window back to the 20:00 just before it.

  No reminders at all for appointments whose status is cancelled.

  Do not log the customer's email address anywhere, because the Data Protection Commission audit flagged exactly that in March.

  Every message ends with the signature Siobhán Ní Dhuibhir. If the customer's country is PL, sign it Grzegorz Szczepański instead, he runs the Kraków branch.

  If you have to cut scope, the 2-hour reminder matters more than the 48-hour one.

  Oh, and times are Europe/Dublin, the server runs in UTC. And return the reminders sorted by send_at, Pádraig's dashboard assumes that. Ignore the old SMS code in the legacy folder, Tomasz is deleting it.

facts:
  - {id: f_entry, type: name, text: "`plan_reminders(appointments, now)`",
     check: {kind: exact, pattern: plan_reminders}}
  # the name anchors the fact; which field wins (polarity) is the judge's call
  - {id: f_optout_field, type: name, text: "The opt-out flag is the field `optout_sms_v2`, not the old `opt_out` one",
     check: {kind: exact, pattern: optout_sms_v2, also_judge: true}}
  - {id: f_rat_optout, type: rationale, text: "because the old field went stale after the March CRM migration",
     check: {kind: judge}}
  # Anchored on the offset (48 h / 2 h), not on the ordinal: design docs write "starts_at minus 48
  # hours", "t-48h", `timedelta(hours=48)`. The 48 of "the 48-hour point" (f_cond_late) and of the
  # priority sentence (f_priority_2h) is excluded; a wrong value counts only next to first/second.
  - {id: f_first, type: number, text: "Send the first reminder 48 hours before the appointment",
     check: {kind: regex, pattern: '(?<!than the )(?<!over the )\b48[- ]?(?:hours?|hrs?|h)\b(?![- ]?(?:point|mark)\b)(?![^.\n;]{0,25}?\b(?:matters|wins|priority|more important)\b)',
            slot: '(?<![^\W_])first(?:[_ \t]+(?:reminder|one|offset|lead))?[ \t:=]+(?:at[ \t]+|is[ \t]+)?(?P<value>\d+)[- ]?(?:hours?|hrs?|h)\b|(?P<value2>\b\d+)[- ]?(?:hours?|hrs?|h)[ \t]+first\b'}}
  - {id: f_second, type: number, text: "the second one two hours before",
     check: {kind: regex, pattern: '(?<!than the )(?<!over the )\b2[- ]?(?:hours?|hrs?|h)\b(?![- ]?(?:point|mark)\b)(?![^.\n;]{0,25}?\b(?:matters|wins|priority|more important)\b)',
            slot: '(?<![^\W_])second(?:[_ \t]+(?:one|reminder|offset|lead))?[ \t:=]+(?P<value>[^.\n;]{1,20}?)[ \t]*(?:hours?|hrs?|h)\b|(?<![^\W_])reminder[ \t]+2\b[ \t:=]+(?P<value2>[^.\n;]{1,20}?)[ \t]*(?:hours?|hrs?|h)\b'}}
  - {id: f_cond_late, type: conditional,
     text: "If the 48-hour point has already passed when we run, send the first one immediately, at `now`, instead.",
     check: {kind: judge}}
  - {id: f_no_past, type: negation, text: "Never return a reminder with a `send_at` in the past.",
     check: {kind: judge}}
  - {id: f_cond_channel, type: conditional,
     text: "Text them if they have a phone number. If optout_sms_v2 is true, don't — email them instead.",
     check: {kind: judge}}
  - {id: f_no_both, type: negation, text: "Never send both an SMS and an email for the same reminder.",
     check: {kind: judge}}
  - {id: f_sms_len, type: number, text: "An SMS must be at most 160 characters.",
     check: {kind: regex, pattern: '\b160\b', slot: '(?P<value>\d+)[ \t-]*(?:characters?|chars?)\b'}}
  - {id: f_priority_time, type: priority,
     text: "If it's too long, shorten the customer's name, but always keep the appointment date and time — the time matters more than the name.",
     check: {kind: judge}}
  - {id: f_quiet, type: number,
     text: "Nothing goes out between 21:00 and 08:00; move anything in that window back to the 20:00 just before it.",
     # window bounds are matched independently (any order/line); the move-back rule is judged
     check: {kind: regex, pattern: '21:00[^\n]*08:00|08:00 <=?[^\n]*hour <=? 21:00', also_judge: true,
            slot: ['\b(?:between|after|from|window|quiet hours?)\b[^\d\n]{0,12}?(?P<value>\d{2}:\d{2})|(?P<value2>\d{2}:\d{2})[ \t]*(?:-|–|to|and|until|till)[ \t]*\d{2}:\d{2}|quiet[_ \t]*(?:start|from|begins?)\w*\W{0,6}(?P<value3>\d{2}:\d{2})',
                   '\b(?:and|to|until|till|before)[ \t]+(?P<value>\d{2}:\d{2})|(?:-|–)[ \t]*(?P<value2>\d{2}:\d{2})|quiet[_ \t]*(?:end|until|to)\w*\W{0,6}(?P<value3>\d{2}:\d{2})']}}
  - {id: f_no_cancelled, type: negation, text: "No reminders at all for appointments whose status is cancelled.",
     check: {kind: judge}}
  - {id: f_no_email_log, type: negation, text: "Do not log the customer's email address anywhere",
     check: {kind: judge}}
  - {id: f_rat_email, type: rationale, text: "because the Data Protection Commission audit flagged exactly that in March",
     check: {kind: judge}}
  - {id: f_signer, type: name, text: "Every message ends with the signature Siobhán Ní Dhuibhir.",
     check: {kind: fuzzy, pattern: Siobhán Ní Dhuibhir, aliases: [Siobhan Ni Dhuibhir],
            ignore: [Grzegorz Szczepański],
            slot: '\b(?:signature|sign(?:ed|s)?(?:[ \t]+(?:it|them|every[ \t]+\w+|all[ \t]+\w+|off))?(?:[ \t]+(?:as|with|by))?)\b[ \t:]+(?:is[ \t]+|of[ \t]+)?(?P<value>(?-i:[A-Z\u00C0-\u00DE\u0100-\u017F])[^\W\d_]+(?:[ \t]+(?-i:[A-Z\u00C0-\u00DE\u0100-\u017F])[^\W\d_]+){1,3})'}}
  - {id: f_signer_pl, type: name, text: "Grzegorz Szczepański",
     check: {kind: fuzzy, pattern: Grzegorz Szczepański, aliases: [Grzegorz Szczepanski]}}
  - {id: f_cond_pl, type: conditional, text: "If the customer's country is PL, sign it Grzegorz Szczepański instead",
     check: {kind: judge}}
  - {id: f_priority_2h, type: priority,
     text: "If you have to cut scope, the 2-hour reminder matters more than the 48-hour one.",
     check: {kind: judge}}
  - {id: f_low_tz, type: low_salience, text: "times are Europe/Dublin, the server runs in UTC",
     check: {kind: regex, pattern: 'Europe/Dublin|Dublin time'}}
  - {id: f_low_sorted, type: low_salience, text: "return the reminders sorted by send_at, Pádraig's dashboard assumes that",
     check: {kind: judge}}
  - {id: f_low_legacy, type: low_salience, text: "Ignore the old SMS code in the legacy folder, Tomasz is deleting it.",
     check: {kind: judge}}

# QA is part of the real team but not a role here: hier_chain uses every role in order,
# so a fifth role would push the endpoint to distance 5 and make QA write the code.
roles:
  - id: lead
    title: tech lead
    instructions: >-
      You are the only person who talks to the client. Turn the client's request into a
      hand-off for the product manager, who will not see the client's message unless you
      pass it on. Do not write code yourself.
  - id: pm
    title: product manager
    instructions: >-
      Turn what you receive into clear requirements and acceptance criteria for the
      software architect. You never talk to the client; you only know what you were sent.
      Do not write code.
  - id: architect
    title: software architect
    instructions: >-
      Design the module (functions, data shapes, edge cases, logging) from the requirements
      you receive and hand the design to the implementer, who only sees your message.
      Do not write the full implementation.
  - id: implementer
    title: Python developer
    instructions: >-
      Implement exactly what you were asked for as a single, self-contained Python 3.12
      module using only the standard library. Keep it short and correct. House rule: log one
      INFO line per planned reminder with the logging module, saying who it goes to and how
      (channel and contact), so support can trace deliveries.

