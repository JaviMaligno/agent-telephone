# Every hidden test calls the entry point. The brief describes the credit before the charge,
# so a natural implementation lists them in that order: a lost "credit first" still passes.
endpoint: {kind: hidden_tests, path: hidden_tests, universal: [f_entry], loss_insensitive: [f_low_order]}
