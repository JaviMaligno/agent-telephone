    kind: punct
    affected_fact_ids: [w_cond_cards]
    wrong_reading: "Finnish menu cards are always printed; the condition is cut off into a fragment of its own"
    wrong_pattern: '\b(?:cards?|print\w*)\b[^.\n]{0,40}?\b(?:spanish|english)\b[^.\n]{0,30}?\b(?:and|,)[ \t]+(?:add[ \t]+)?finnish\b(?![^.\n]{0,40}?(?:\b(?:if|when|once|provided|unless|only|as long as)\b|>[ \t]*25|\b(?:more than|over|above|at least)[ \t]+25\b))'
    wrong_context: '\b(?:menu|cards?|languages?|print\w*)\b'
